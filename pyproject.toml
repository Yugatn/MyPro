[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mypro"
version = "0.4.0"
description = "Evidence Core for verifiable digital content"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yugatn" }]
dependencies = [
  "blake3>=0.4",
  "typer>=0.12",
  "opentimelineio>=0.17"
]

[project.scripts]
mypro = "cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10"
]

[tool.setuptools.packages.find]
include = ["core*", "ai*", "integrations*", "runtime*", "sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
